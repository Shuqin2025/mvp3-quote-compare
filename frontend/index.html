<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- 可用 ?api= 覆盖；否则读取此 meta；再否则回退 /v1/api -->
  <meta name="api-base" content="https://yunivera-gateway.onrender.com/v1/api" />
  <title>云贸星 · 智能表格生成器</title>
</head>
<body>
  <!-- 可选增强开关 + 导出模块位置（相对 frontend/index.html） -->
  <script>
    window.UI_ENHANCE = {
      enhance: true,                    // 开启 plus 版
      exportModule: './export-xlsx.js', // ← 这里是相对 frontend/ 的正确写法
    };
  </script>

  <!-- 注意：public 下的文件要用根路径 / 引用；不要写 ./public/... -->
  <script type="module" src="/ui-enhance.plus.js?enhance=1"></script>
  <!-- 如果临时想用普通版，改为：<script type="module" src="/ui-enhance.js?v=final"></script> -->
</body>
</html>
