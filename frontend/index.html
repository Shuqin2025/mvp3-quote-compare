<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MVP3 Quote Compare</title>
  <style>
    body { font-family: sans-serif; margin: 1em; }
    #langSwitcher { margin-bottom: 1em; display: flex; gap: 8px; }
    #langSwitcher button { padding: 4px 8px; }
  </style>
</head>
<body>
  <!-- 语言切换器 -->
  <div id="langSwitcher">
    <button onclick="i18n.setLang('zh')">🇨🇳 中文</button>
    <button onclick="i18n.setLang('de')">🇩🇪 Deutsch</button>
    <button onclick="i18n.setLang('en')">🇬🇧 English</button>
  </div>

  <!-- React / Vite 挂载点 -->
  <div id="root"></div>

  <!-- 极简 i18n（增强匹配：不依赖 data-i18n，直接把已知中/德/英文案映射为目标语言） -->
  <script>
  (function () {
    /* ---- 词典：只覆盖当前页面上出现的固定文案。后续要加/改再一起扩展 ---- */
    const DICT = {
      title: { zh: "MVP3：抓取 + 填写 + PDF/Excel 生成", de: "MVP3: Scrapen + Ausfüllen + PDF/Excel", en: "MVP3: Scrape + Fill + PDF/Excel" },

      bodyLabel: { zh: "正文 / Text：", de: "Text:", en: "Text:" },

      // 顶部按钮/操作按钮
      backendCheck: { zh: "后端健康检查", de: "Backend-Check", en: "Backend Check" },
      makePdf:      { zh: "生成 PDF",     de: "PDF erzeugen",   en: "Generate PDF" },
      fetch:        { zh: "抓取目录",     de: "Abrufen",        en: "Fetch" },
      fill50:       { zh: "目录写入正文（前 50 条）", de: "In Text einfügen (erste 50)", en: "Write into Body (first 50)" },
      exportExcel:  { zh: "导出 Excel",   de: "Excel exportieren", en: "Export Excel" },
      pdfTable:     { zh: "表格 PDF",     de: "Tabelle als PDF",  en: "Export PDF (table)" },

      // 区块标题 & 输入提示
      demoHdr: { zh: "目录抓取 Demo（/v1/api/catalog/parse）", de: "Katalog-Demo (/v1/api/catalog/parse)", en: "Catalog Fetch Demo (/v1/api/catalog/parse)" },
      urlPh:   { zh: "https://example.com", de: "https://beispiel.de", en: "https://example.com" },
      jsonHint:{ zh: "目录抓取结果 JSON 会显示在这里。", de: "Das JSON-Ergebnis erscheint hier.", en: "Fetched JSON will appear here." }
    };

    /* ---- 这些是页面上可能出现的“同义变体”，用于识别现有文字 ---- */
    const VARIANTS = {
      title: [
        /MVP3[:：]\s*Scrapen\s*\+\s*Ausfüllen\s*\+\s*PDF erzeugen/i,
        /MVP3[:：]\s*Scrapen\s*\+\s*Ausfüllen\s*\+\s*PDF\/Excel/i,
        /MVP3[:：]\s*抓取\s*\+\s*填写\s*\+\s*PDF\/Excel\s*生成/i,
        /MVP3[:：]\s*Scrape\s*\+\s*Fill\s*\+\s*PDF\/Excel/i
      ],
      bodyLabel: [/正文\s*\/\s*Text[:：]?/i, /^Text[:：]?$/i],

      backendCheck: [/Backend-?Check/i, /后端健康检查/i, /Backend Check/i],
      makePdf:      [/PDF\s*erzeugen/i, /生成\s*PDF/i, /Generate\s*PDF/i],
      fetch:        [/抓取目录/i, /Abrufen/i, /^Fetch$/i],
      fill50:       [/目录写入正文（前\s*50\s*条）/i, /In Text einfügen\s*\(erste\s*50\)/i, /Write into Body\s*\(first\s*50\)/i],
      exportExcel:  [/导出\s*Excel/i, /Excel exportieren/i, /Export\s*Excel/i],
      pdfTable:     [/表格\s*PDF/i, /Tabelle.*PDF/i, /PDF\s*\(table\)/i],

      demoHdr: [/目录抓取\s*Demo/i, /Katalog-?Demo/i, /Catalog Fetch Demo/i],
      jsonHint: [/JSON.*(显示|erscheint|appear)/i]
    };

    const LANGS = ["zh","de","en"];
    function pickLang() {
      const url = new URL(location.href);
      const q = (url.searchParams.get("lang") || "").toLowerCase();
      const s = (localStorage.getItem("lang") || "").toLowerCase();
      const nav = (navigator.language || "de").slice(0,2).toLowerCase();
      const cand = q || s || (LANGS.includes(nav) ? nav : "de");
      return LANGS.includes(cand) ? cand : "de";
    }

    /* ---- 把某个元素的文本替换为目标语言 ---- */
    function setText(el, key, lang) {
      if (!el) return;
      const target = DICT[key]?.[lang];
      if (typeof target === "string") el.textContent = target;
    }
    function setPlaceholder(el, key, lang) {
      if (!el) return;
      const target = DICT[key]?.[lang];
      if (typeof target === "string") el.setAttribute("placeholder", target);
    }

    /* ---- 粗暴扫描整页：凡是匹配到“任一语言变体”的元素，统一改成目标语言 ---- */
    function translateAll(lang) {
      // 标题（h1）
      const h1 = document.querySelector("h1");
      if (h1 && VARIANTS.title.some(re => re.test(h1.textContent || ""))) {
        setText(h1, "title", lang);
      }

      // “正文 / Text：” 这个标签：找 textarea 上方的标签或任何包含匹配词的 label/span/div
      const ta = document.querySelector("textarea");
      if (ta) {
        let labelCand = ta.previousElementSibling;
        if (!labelCand) {
          labelCand = Array.from(document.querySelectorAll("label,span,div"))
            .find(el => VARIANTS.bodyLabel.some(re => re.test(el.textContent || "")));
        }
        setText(labelCand, "bodyLabel", lang);
      }

      // 所有按钮：逐个匹配
      const buttons = Array.from(document.querySelectorAll("button"));
      const applyBtn = (key, reList) => {
        const btn = buttons.find(b => reList.some(re => re.test((b.textContent || "").trim())));
        setText(btn, key, lang);
      };
      applyBtn("backendCheck", VARIANTS.backendCheck);
      applyBtn("makePdf",      VARIANTS.makePdf);
      applyBtn("fetch",        VARIANTS.fetch);
      applyBtn("fill50",       VARIANTS.fill50);
      applyBtn("exportExcel",  VARIANTS.exportExcel);
      applyBtn("pdfTable",     VARIANTS.pdfTable);

      // “目录抓取 Demo …” 标题
      const demoHdr = Array.from(document.querySelectorAll("h3,h4,div"))
        .find(el => VARIANTS.demoHdr.some(re => re.test(el.textContent || "")));
      setText(demoHdr, "demoHdr", lang);

      // URL 输入框 placeholder
      const urlInput = document.querySelector("input[type='text']") || document.querySelector("input");
      setPlaceholder(urlInput, "urlPh", lang);

      // JSON 区域提示（pre 或 textarea 的 placeholder）
      const jsonBlock = document.querySelector("pre,textarea");
      if (jsonBlock) {
        if (jsonBlock.tagName === "TEXTAREA") setPlaceholder(jsonBlock, "jsonHint", lang);
        else setText(jsonBlock, "jsonHint", lang);
      }
    }

    /* ---- 对 React 渲染变化做监听，随时重译 ---- */
    function startObserver() {
      const mo = new MutationObserver(() => {
        translateAll(window.__currentLang || "de");
      });
      mo.observe(document.body, { childList: true, subtree: true });
    }

    /* ---- fetch 打补丁：自动带语言，导出接口自动拼 ?lang=xx ---- */
    (function patchFetch() {
      if (!window.fetch) return;
      const orig = window.fetch.bind(window);
      window.fetch = (input, init = {}) => {
        const lang = window.__currentLang || pickLang();
        const hdrs = new Headers(init.headers || (input && input.headers) || {});
        hdrs.set("X-Lang", lang);
        init.headers = hdrs;

        try {
          const url = typeof input === "string"
            ? new URL(input, location.origin)
            : new URL(input.url || "", location.origin);
          if (url.pathname.startsWith("/v1/api/export/")) {
            url.searchParams.set("lang", lang);
            input = url.toString();
          }
        } catch {}
        return orig(input, init);
      };
    })();

    /* ---- 公开：切换语言 ---- */
    function setLang(lang) {
      if (!LANGS.includes(lang)) lang = "de";
      localStorage.setItem("lang", lang);
      window.__currentLang = lang;
      translateAll(lang);
    }
    window.i18n = { setLang, pickLang };

    /* ---- 初始化 ---- */
    document.addEventListener("DOMContentLoaded", () => {
      const lang = pickLang();
      window.__currentLang = lang;
      translateAll(lang);
      startObserver();
    });
  })();
  </script>

  <!-- React 入口（保持不变） -->
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
