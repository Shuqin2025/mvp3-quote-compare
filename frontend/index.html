<!-- frontend/index.html —— 直接整文件替换 -->
<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MVP3 Quote Compare</title>
  <link rel="stylesheet" href="/ui-enhance.css?v=36" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 1em; }
    #langSwitcher { margin-bottom: 1em; display: flex; gap: 8px; }
    #langSwitcher button { padding: 4px 8px; }
  </style>
</head>
<body>
  <!-- 简单语言切换（仅演示，不改文案；真实文案由 i18n.js 覆盖） -->
  <div id="langSwitcher">
    <button onclick="i18n.setLang('zh')">CN 中文</button>
    <button onclick="i18n.setLang('de')">DE Deutsch</button>
    <button onclick="i18n.setLang('en')">GB English</button>
  </div>

  <!-- React 容器 -->
  <div id="root"></div>

  <!-- 语言脚本（安全；只覆盖语言静态脚本） -->
  <script src="/i18n.js?v=36"></script>

  <!-- UI 增强脚本（按钮状态、开发提示等） -->
  <script src="/ui-enhance.js?v=36"></script>

  <!-- Vite / React 入口（构建后替换为 /assets/index-*.js） -->
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
