<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>云贸星 智能表格生成器</title>
    <style>
      :root { --bg:#f9fafb; --card:#fff; --text:#111827; --muted:#6b7280; --border:#e5e7eb; --brand:#2563eb; }
      *{box-sizing:border-box}
      body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Noto Sans CJK SC","Microsoft YaHei","Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
      .wrap{max-width:1080px;margin:24px auto;padding:0 16px}
      .toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
      .btn{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer}
      .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
      .btn:disabled{opacity:.5;cursor:not-allowed}
      .pill{padding:8px 12px;border-radius:10px;background:#ecfdf5;color:#065f46;margin:12px 0;border:1px solid #a7f3d0}
      .warn{padding:8px 12px;border-radius:10px;background:#fff7ed;color:#9a3412;margin:12px 0;border:1px solid #fed7aa}
      .card{background:var(--card);border:1px solid var(--border);border-radius:12px}
      .row{display:flex;gap:8px;align-items:center;padding:12px}
      .row input[type=url]{flex:1;height:38px;border:1px solid var(--border);border-radius:8px;padding:0 12px;min-width:240px}
      .row select{height:38px;border:1px solid var(--border);border-radius:8px;padding:0 8px}
      .pad{padding:12px}
      .holder{height:260px;border:1px dashed var(--border);border-radius:8px;background:repeating-linear-gradient(45deg,#fafafa,#fafafa 10px,#f5f5f5 10px,#f5f5f5 20px);display:flex;align-items:center;justify-content:center;color:var(--muted)}
      table{width:100%;border-collapse:collapse}
      th,td{border-bottom:1px solid var(--border);padding:10px 8px;text-align:left;vertical-align:top}
      th{background:#f8fafc;position:sticky;top:0;z-index:1}
      .imgCell img{width:72px;height:72px;object-fit:contain;border:1px solid var(--border);border-radius:6px;background:#fff}
      .muted{color:var(--muted)}
      .right{margin-left:auto}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="toolbar">
        <button class="btn" data-lang="cn">中文</button>
        <button class="btn" data-lang="de">DE</button>
        <button class="btn" data-lang="en">EN</button>
        <div class="right muted" id="envNote"></div>
      </div>

      <div id="tip" class="warn">这是页面骨架的占位提示（无脚本、无接口），用于验证部署是否稳定。</div>
      <div id="stat" class="pill" style="display:none"></div>

      <div class="card">
        <div class="row">
          <input id="inputUrl" type="url" placeholder="输入目录型网页链接，例如：https://www.s-impuls-shop.de/catalog/home-cinema/audio-kabel" />
          <button id="btnFetch" class="btn primary">抓取目录</button>
          <select id="limit">
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
          <button id="btnExportTop" class="btn">导出 Excel（.xlsx）</button>
          <button id="btnClear" class="btn">清空数据</button>
        </div>
        <div class="pad">
          <div id="holder" class="holder">ui.no_data</div>
          <div id="tableWrap" style="display:none;max-height:540px;overflow:auto">
            <table id="resultTable">
              <thead>
                <tr>
                  <th style="width:60px">#</th>
                  <th style="width:120px">Item No.</th>
                  <th style="width:100px">Picture</th>
                  <th>Description</th>
                  <th style="width:100px">MOQ</th>
                  <th style="width:120px">Unit Price</th>
                  <th style="width:90px">Link</th>
                </tr>
              </thead>
              <tbody id="resultBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="row">
        <button id="btnExportBottom" class="btn">导出 Excel（.xlsx）</button>
        <div class="muted">© MVP3 — 页面骨架（占位版）。确认部署稳定后，将逐步接回业务逻辑。</div>
      </div>
    </div>

    <!-- 业务脚本：一定要放在末尾并使用 defer，避免白屏 -->
    <script src="./ui-enhance.js" defer></script>
  </body>
</html>
