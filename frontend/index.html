<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="api-base" content="https://yunivera-gateway.onrender.com/v1/api" />
  <meta name="ui-enhance" content="on" />
  <title>云贸星 · 智能表格生成器</title>
</head>
<body>
  <!-- 你的页面 DOM 保持不变：txtUrl / limit / btnFetch / btnExport / btnClear / #tbl 等 -->
  <script>
    // ① 这里改：告诉 plus 版从哪里加载导出模块
    //   最稳的做法：把 export-xlsx.js 放一份到 frontend/public/ 下
    //   然后这里填 “/export-xlsx.js”（因为 public 会被拷贝到根）
    window.UI_ENHANCE = {
      enhance: true,
      exportModule: '/export-xlsx.js'
    };
  </script>

  <!-- ② 这里改：public 下的文件用“根绝对路径”引入，不要写 ./public/... -->
  <script type="module" src="/ui-enhance.plus.js?enhance=1"></script>
</body>
</html>
