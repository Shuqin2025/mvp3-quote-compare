<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- 强烈建议把网关根设在这里，也支持用 ?api= 覆盖 -->
  <meta name="api-base" content="https://yunivera-gateway.onrender.com/v1/api" />
  <meta name="ui-enhance" content="on" />
  <title>云贸星 · 智能表格生成器</title>
  <style>
    body{font:14px/1.6 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;}
    .toolbar{display:flex;gap:8px;align-items:center;margin:18px 0;}
    .btn{padding:6px 12px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer}
    .btn.primary{background:#2563eb;color:#fff;border-color:#1e40af}
    table{width:100%;border-collapse:collapse;margin-top:12px}
    th,td{border:1px solid #eee;padding:8px;vertical-align:top}
    th{background:#f6f7fb}
    .thumb{height:54px;max-width:120px;object-fit:contain;border-radius:4px;background:#fff}
    .alert{display:block;color:#444}
    .alert.ok{color:#065f46}
  </style>
</head>
<body>
  <div class="toolbar">
    <input id="txtUrl" style="width:420px" placeholder="https://example.com/category/..." />
    <input id="limit" type="number" value="50" style="width:80px" />
    <button id="btnFetch"  class="btn primary">抓取目录</button>
    <button id="btnExport" class="btn">导出 Excel（.xlsx）</button>
    <button id="btnClear"  class="btn">清空数据</button>
  </div>

  <div id="status" class="alert">准备就绪</div>
  <div id="okbar" class="alert ok" style="display:none"></div>

  <table id="tbl">
    <thead>
      <tr>
        <th>#</th><th>货号</th><th>图片</th><th>描述</th><th>单价</th><th>打开</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- 唯一入口：plus 版（强制 /v1/api/*） -->
  <script type="module" src="./public/ui-enhance.plus.js?enhance=1"></script>
</body>
</html>
