<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MVP3 Quote Compare</title>
  <style>
    body { font-family: sans-serif; margin: 1em; }
    #langSwitcher button { margin-right: 8px; }
  </style>
</head>
<body>
  <!-- 语言切换器 -->
  <div id="langSwitcher" style="margin-bottom: 1em;">
    <button onclick="i18n.setLang('zh')">🇨🇳 中文</button>
    <button onclick="i18n.setLang('de')">🇩🇪 Deutsch</button>
    <button onclick="i18n.setLang('en')">🇬🇧 English</button>
  </div>

  <!-- React / Vite 挂载点 -->
  <div id="root"></div>

  <!-- 轻量 i18n（修复版） -->
  <script>
  (function () {
    /* ===== 字典：先覆盖当前页面常见文案；后续你要改文案我们再补充 ===== */
    const dict = {
      en: {
        "app.title": "MVP3: Scrape + Fill + PDF/Excel",
        "label.body": "Text:",
        "btn.health": "Backend Check",
        "btn.makePdf": "Generate PDF",
        "block.demo": "Catalog Fetch Demo (/v1/api/catalog/parse)",
        "ph.url": "https://example.com",
        "btn.fetch": "Fetch",
        "btn.fill50": "Write into Body (first 50)",
        "btn.excel": "Export Excel",
        "btn.pdfTable": "Export PDF (table)",
        "hint.json": "Fetched JSON will appear here."
      },
      de: {
        "app.title": "MVP3: Scrapen + Ausfüllen + PDF/Excel",
        "label.body": "Text:",
        "btn.health": "Backend-Check",
        "btn.makePdf": "PDF erzeugen",
        "block.demo": "Katalog-Demo (/v1/api/catalog/parse)",
        "ph.url": "https://beispiel.de",
        "btn.fetch": "Abrufen",
        "btn.fill50": "In Text einfügen (erste 50)",
        "btn.excel": "Excel exportieren",
        "btn.pdfTable": "Tabelle als PDF",
        "hint.json": "Das JSON-Ergebnis erscheint hier."
      },
      zh: {
        "app.title": "MVP3：抓取 + 填写 + PDF/Excel 生成",
        "label.body": "正文 / Text：",
        "btn.health": "后端健康检查",
        "btn.makePdf": "生成 PDF",
        "block.demo": "目录抓取 Demo（/v1/api/catalog/parse）",
        "ph.url": "https://example.com",
        "btn.fetch": "抓取目录",
        "btn.fill50": "目录写入正文（前 50 条）",
        "btn.excel": "导出 Excel",
        "btn.pdfTable": "表格 PDF",
        "hint.json": "目录抓取结果 JSON 会显示在这里。"
      }
    };

    const LANGS = ["zh", "de", "en"];

    function currentLang() {
      const url = new URL(location.href);
      const q = (url.searchParams.get("lang") || "").toLowerCase();
      const s = (localStorage.getItem("lang") || "").toLowerCase();
      const nav = (navigator.language || "de").slice(0,2).toLowerCase();
      const cand = q || s || (LANGS.includes(nav) ? nav : "de");
      return LANGS.includes(cand) ? cand : "de";
    }

    /* ===== 绑定 data-i18n（不改 React 代码——用 DOM 贴片） ===== */
    function bindKeysOnce() {
      // 标题
      const h1 = document.querySelector("h1");
      if (h1 && !h1.dataset.i18n) h1.dataset.i18n = "app.title";

      // “正文 / Text：” 标签：找在 textarea 上方、含“正文”或“Text”的元素
      const textareas = document.querySelectorAll("textarea");
      if (textareas.length) {
        // 在第一个 textarea 上方的同级前一个元素里找
        const ta = textareas[0];
        let labelCand = ta.previousElementSibling;
        if (!labelCand) {
          // 再从页面上所有 label/div/span 中按文本匹配
          labelCand = Array.from(document.querySelectorAll("label,div,span"))
            .find(el => /正文|Text/i.test(el.textContent || ""));
        }
        if (labelCand && !labelCand.dataset.i18n) labelCand.dataset.i18n = "label.body";
      }

      // 按钮类：用文案匹配（中/德/英）
      const allButtons = Array.from(document.querySelectorAll("button"));
      const matchBtn = (re) => allButtons.find(b => re.test((b.textContent || "").trim()));

      const bHealth   = matchBtn(/Backend-?Check|健康|Health/i);
      if (bHealth && !bHealth.dataset.i18n) bHealth.dataset.i18n = "btn.health";

      const bMakePdf  = matchBtn(/PDF\s*erzeugen|生成\s*PDF|Generate\s*PDF|PDF\s*\/\s*PDF/i);
      if (bMakePdf && !bMakePdf.dataset.i18n) bMakePdf.dataset.i18n = "btn.makePdf";

      const bFetch    = matchBtn(/抓取|Abrufen|Fetch/i);
      if (bFetch && !bFetch.dataset.i18n) bFetch.dataset.i18n = "btn.fetch";

      const bFill50   = matchBtn(/写入|einfügen|Write/i);
      if (bFill50 && !bFill50.dataset.i18n) bFill50.dataset.i18n = "btn.fill50";

      const bExcel    = matchBtn(/Excel/i);
      if (bExcel && !bExcel.dataset.i18n) bExcel.dataset.i18n = "btn.excel";

      const bPdfTable = matchBtn(/表格\s*PDF|Tabelle.*PDF|PDF\s*\(table\)/i);
      if (bPdfTable && !bPdfTable.dataset.i18n) bPdfTable.dataset.i18n = "btn.pdfTable";

      // 区块标题 “目录抓取 Demo …”
      const demoHdr = Array.from(document.querySelectorAll("h3,h4,div"))
        .find(el => /Demo.*catalog\/parse|目录抓取\s*Demo/i.test(el.textContent || ""));
      if (demoHdr && !demoHdr.dataset.i18n) demoHdr.dataset.i18n = "block.demo";

      // URL 输入框 placeholder
      const urlInput = document.querySelector("input[type='text']") || document.querySelector("input");
      if (urlInput && !urlInput.dataset.i18nPh) urlInput.dataset.i18nPh = "ph.url";

      // JSON 提示：pre 或 textarea
      const jsonHint = document.querySelector("pre,textarea");
      if (jsonHint && !jsonHint.dataset.i18n) {
        if (jsonHint.tagName === "TEXTAREA") jsonHint.dataset.i18nPh = "hint.json";
        else jsonHint.dataset.i18n = "hint.json";
      }
    }

    /* ===== 应用翻译 ===== */
    function applyI18n(lang) {
      const pack = dict[lang] || dict.de;

      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        const txt = pack[key];
        if (typeof txt === "string") el.textContent = txt;
      });

      const setPh = (el, key) => {
        const txt = pack[key];
        if (typeof txt === "string") el.setAttribute("placeholder", txt);
      };
      document.querySelectorAll("[data-i18n-ph]").forEach(el => setPh(el, el.getAttribute("data-i18n-ph")));
      document.querySelectorAll("[data-i18nPh]").forEach(el => setPh(el, el.getAttribute("data-i18nPh")));
    }

    /* ===== 公开：切换语言 ===== */
    function setLang(lang) {
      const use = LANGS.includes(lang) ? lang : "de";
      localStorage.setItem("lang", use);
      window.__currentLang = use;
      bindKeysOnce();
      applyI18n(use);
    }
    window.i18n = { setLang, pickLang: currentLang };

    /* ===== 初始化 & 监听 React 渲染 ===== */
    document.addEventListener("DOMContentLoaded", () => {
      const lang = currentLang();
      window.__currentLang = lang;
      bindKeysOnce();
      applyI18n(lang);

      // React/Vite 渲染更新时重新绑定
      const mo = new MutationObserver(() => {
        bindKeysOnce();
        applyI18n(window.__currentLang || "de");
      });
      mo.observe(document.body, { childList: true, subtree: true });
    });

    /* ===== fetch 打补丁：自动带语言，导出接口自动拼 ?lang=xx ===== */
    (function patchFetch() {
      if (!window.fetch) return;
      const orig = window.fetch.bind(window);
      window.fetch = (input, init = {}) => {
        const lang = window.__currentLang || currentLang();
        const hdrs = new Headers(init.headers || (input && input.headers) || {});
        hdrs.set("X-Lang", lang);
        init.headers = hdrs;

        try {
          const url = typeof input === "string"
            ? new URL(input, location.origin)
            : new URL(input.url || "", location.origin);
          if (url.pathname.startsWith("/v1/api/export/")) {
            url.searchParams.set("lang", lang);
            input = url.toString();
          }
        } catch {}
        return orig(input, init);
      };
    })();
  })();
  </script>

  <!-- React 入口（保持不变） -->
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
