<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title data-i18n="app_title">云贸星 智能表格生成器</title>

  <!-- 样式（若你已有自己的 css 文件名，请保持原路径不变） -->
  <link rel="stylesheet" href="public/ui-enhance.css" />

  <!-- 提前注入后端 API 基址：支持 ?api=https://your-backend.example.com -->
  <script>
    (function () {
      const p = new URLSearchParams(location.search);
      // 允许拼接 /v1/api/... 的绝对基址（ui-enhance.js 内会用）
      window.API_BASE = (p.get('api') || '').replace(/\/+$/,'');
    })();
  </script>

  <!-- 先加载 i18n，再加载主逻辑（都用 defer，避免阻塞与变量未定义） -->
  <script src="public/i18n.js" defer></script>
  <script src="public/ui-enhance.js" defer></script>

  <style>
    /* 让“暂无数据”区域看起来是空白，但保留边框与占位 */
    .blank-pad {
      min-height: 480px;
      border: 1px dashed #e5e7eb;
      border-radius: 10px;
      background: #fff; /* 纯白 */
    }
    .toolbar {
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    }
    .toolbar > * { margin: 4px 0; }
    .titlebar { margin: 10px 0 6px 0; }
    .titlebar h1 { font-size: 28px; margin: 0; }
    .subtitle { color:#666; font-size: 14px; margin: 0 0 14px 0; }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      text-align: left; padding: 10px 8px; border-bottom: 1px solid #eee; color:#111827; font-weight: 600;
    }
    tbody td { padding: 10px 8px; border-bottom: 1px solid #f2f2f2; vertical-align: middle; }
    .col-idx { width: 48px; }
    .col-sku { width: 120px; }
    .col-pic { width: 100px; }
    .pic-ph { width: 56px; height: 36px; background:#f5f5f5; border:1px solid #eee; border-radius:4px; display:inline-block; }
    .toast {
      position: relative; margin: 8px 0 12px 0; display: none;
      padding: 10px 12px; border-radius: 8px; font-size: 14px;
    }
    .toast.ok { display:block; background:#ecfdf5; color:#065f46; border:1px solid #a7f3d0; }
    .toast.warn { display:block; background:#fff7ed; color:#9a3412; border:1px solid #fed7aa; }
    .footer { margin: 18px 0 10px 0; color:#6b7280; font-size: 13px; display:flex; gap:18px; }
    .footer a { color:#6b7280; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
    .hidden { display:none !important; }
  </style>
</head>

<body>
  <!-- 语言切换（i18n.js 会绑定处理） -->
  <div class="toolbar" style="justify-content:flex-start;">
    <button id="btnLangZh">CN 中文</button>
    <button id="btnLangDe">DE Deutsch</button>
    <button id="btnLangEn">GB English</button>
  </div>

  <div class="titlebar">
    <h1 id="appTitle" data-i18n="app_title">云贸星 智能表格生成器</h1>
    <p class="subtitle" data-i18n="sub_title">输入目录型网页链接，秒生成 Excel 产品表格。</p>
  </div>

  <!-- 工具栏 -->
  <div class="toolbar">
    <input id="txtUrl" type="text" style="flex:1; min-width:420px;"
           placeholder=""
           data-i18n-placeholder="placeholder_url" />

    <button id="btnFetch" data-i18n="btn_fetch">抓取目录</button>

    <select id="selPreview" title="Preview">
      <option value="50">50</option>
      <option value="100">100</option>
      <option value="200">200</option>
    </select>

    <button id="btnExport" data-i18n="btn_export">导出 Excel（.xlsx）</button>
    <button id="btnClear" data-i18n="btn_clear">清空数据</button>
  </div>

  <!-- 提示条（showToast 会用到） -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- 结果区：保持“空白视觉”，但保留脚本需要的占位 DOM -->
  <div class="blank-pad">
    <!-- 这个空块供脚本控制显示/隐藏，无视觉干扰 -->
    <div id="empty" class="hidden"></div>

    <!-- 数据表 -->
    <table id="tbl">
      <thead>
        <tr>
          <th class="col-idx" data-i18n="th_index">#</th>
          <th class="col-sku" data-i18n="th_sku">Item No.</th>
          <th class="col-pic" data-i18n="th_pic">Picture</th>
          <th data-i18n="th_title">Description</th>
          <th data-i18n="th_moq">MOQ</th>
          <th data-i18n="th_price">Unit Price</th>
          <th data-i18n="th_link">链接</th>
        </tr>
      </thead>
      <tbody id="tblBody"></tbody>
    </table>
  </div>

  <!-- 页脚链接（文本走 i18n） -->
  <div class="footer">
    <a id="lnkSites" href="#" target="_blank" rel="noopener" data-i18n="footer_sites">支持的网站</a>
    <a id="lnkPrivacy" href="#" target="_blank" rel="noopener" data-i18n="footer_privacy">隐私政策</a>
    <a id="lnkContact" href="#" target="_blank" rel="noopener" data-i18n="footer_contact">联系我们</a>
  </div>

  <!-- 启动时的最小兜底（可选） -->
  <script>
    // 如果 i18n.js 已加载，会把 data-i18n / data-i18n-placeholder 替换为当前语言
    // 这里不做任何覆盖，只是提供一个极轻量的兜底位移。
  </script>
</body>
</html>
