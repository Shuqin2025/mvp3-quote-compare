<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yunivera DataBridge</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    :root { --radius: 10px; --border:#e5e7eb; --muted:#6b7280; --primary:#2563eb; }
    body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif; color:#111827; background:#fff; margin:0; }
    .container { max-width:1200px; margin: 24px auto; padding: 0 16px; }
    .lang { display:flex; gap:8px; margin-bottom:12px; }
    .lang button{ border:1px solid var(--border); background:#fff; border-radius:999px; padding:6px 12px; cursor:pointer; }
    .lang button.active{ background:#111827; color:#fff; border-color:#111827; }
    h1 { font-size:28px; margin:8px 0 4px; font-weight:800;}
    .subtitle{ color:var(--muted); font-size:14px; margin-bottom:16px;}
    .bar{ display:flex; gap:10px; align-items:center; }
    .bar input[type="text"]{ flex:1; padding:10px 12px; border:1px solid var(--border); border-radius: var(--radius); }
    .bar select, .bar button { height:40px; border-radius: var(--radius); border:1px solid var(--border); background:#fff; }
    .bar button.primary{ background:var(--primary); color:#fff; border-color:var(--primary); }
    .panel{ margin-top:12px; border:1px dashed var(--border); border-radius: var(--radius); padding:0; background:#fff; }
    /* 纯空白占位，不再使用斜纹 */
    #empty{ color:#9ca3af; padding:8px 12px; }

    table{ width:100%; border-collapse: collapse; border-spacing:0; }
    thead th{ text-align:left; font-weight:700; color:#111827; font-size:13px; padding:12px; border-bottom:1px solid var(--border); background:#f9fafb; }
    tbody td{ padding:12px; border-bottom:1px solid var(--border); vertical-align: top; }
    .footer{ display:flex; gap:18px; margin-top:16px; color:#2563eb; font-size:14px;}
    .footer a{ color:#2563eb; text-decoration:none; }
    .toast{ margin-top:10px; padding:10px 12px; border-radius:var(--radius); font-size:14px; display:none;}
    .toast.ok{ background:#ecfdf5; color:#065f46; border:1px solid #10b981;}
    .toast.warn{ background:#fff7ed; color:#7c2d12; border:1px solid #fb923c;}
    .hidden{ display:none; }
  </style>

  <!-- i18n & UI 脚本，defer 保证在 DOM 后执行 -->
  <script src="/public/i18n.js" defer></script>
  <script src="/public/ui-enhance.js" defer></script>
</head>
<body>
  <div class="container">
    <!-- 语言切换 -->
    <div class="lang" id="langBar">
      <button data-lang="zh" id="btnZh">CN 中文</button>
      <button data-lang="de" id="btnDe">DE Deutsch</button>
      <button data-lang="en" id="btnEn">GB English</button>
    </div>

    <!-- 标题与副标题（文本由 i18n 注入） -->
    <h1 id="title">Yunivera DataBridge</h1>
    <div class="subtitle" id="subtitle"></div>

    <!-- 工具条 -->
    <div class="bar">
      <input id="txtUrl" type="text" placeholder="" />
      <button id="btnFetch" class="primary"></button>
      <select id="selPreview">
        <option value="50">50</option>
        <option value="100">100</option>
        <option value="200">200</option>
      </select>
      <button id="btnExport"></button>
      <button id="btnClear"></button>
      <!-- 为了兼容旧脚本，保留一个隐藏的富化勾选（不会显示也不会影响） -->
      <label class="hidden"><input id="chkEnrich" type="checkbox" /></label>
    </div>

    <!-- 提示条（由脚本控制显示/隐藏和内容/样式） -->
    <div id="toast" class="toast"></div>

    <!-- 结果区 -->
    <div class="panel">
      <!-- 空白占位（i18n 控制文字；index 保持干净） -->
      <div id="empty"></div>
      <table id="tbl">
        <thead>
          <tr>
            <th id="thIdx">#</th>
            <th id="thSku">Item No.</th>
            <th id="thPic">Picture</th>
            <th id="thTitle">Description</th>
            <th id="thMoq">MOQ</th>
            <th id="thPrice">Unit Price</th>
            <th id="thLink"></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <!-- 页脚链接 -->
    <div class="footer">
      <a id="lnkSupport" target="_blank" href="#"></a>
      <a id="lnkPrivacy" target="_blank" href="#"></a>
      <a id="lnkContact" target="_blank" href="#"></a>
    </div>
  </div>

  <script>
    // 兜底：等 DOM 全部就绪再初始化文案，避免“取不到节点”的问题
    document.addEventListener('DOMContentLoaded', function () {
      // i18n 注入（与 /public/i18n.js 对齐）
      var T = window.T || function(k){ return k; };

      // 顶部标题与副标题
      // 中文标题：云贸星 智能表格生成器；DE/EN 保持 Yunivera DataBridge
      var lang = (window.i18n && i18n.lang) || 'zh';
      document.getElementById('title').textContent = (lang === 'zh')
        ? T('app.title_zh')   // 例：云贸星 智能表格生成器
        : T('app.title');     // 例：Yunivera DataBridge

      document.getElementById('subtitle').textContent = T('app.subtitle');

      // 输入框 placeholder、按钮文字、导出与清空
      var inp = document.getElementById('txtUrl');
      inp.placeholder = T('ui.input_placeholder');

      document.getElementById('btnFetch').textContent  = T('ui.fetch_btn');     // 抓取目录 / Katalog abrufen / Fetch
      document.getElementById('btnExport').textContent = T('ui.export_btn');    // 导出 Excel（.xlsx）
      document.getElementById('btnClear').textContent  = T('ui.clear_btn');     // 清空数据

      // 表头
      document.getElementById('thIdx').textContent   = T('tbl.idx');
      document.getElementById('thSku').textContent   = T('tbl.sku');
      document.getElementById('thPic').textContent   = T('tbl.pic');
      document.getElementById('thTitle').textContent = T('tbl.title');
      document.getElementById('thMoq').textContent   = T('tbl.moq');
      document.getElementById('thPrice').textContent = T('tbl.price');
      document.getElementById('thLink').textContent  = T('tbl.link');

      // 空态文案
      document.getElementById('empty').textContent = T('ui.empty');

      // 页脚
      document.getElementById('lnkSupport').textContent = T('footer.support');
      document.getElementById('lnkPrivacy').textContent = T('footer.privacy');
      document.getElementById('lnkContact').textContent = T('footer.contact');

      // 语言切换按钮样式
      var btnZh = document.getElementById('btnZh');
      var btnDe = document.getElementById('btnDe');
      var btnEn = document.getElementById('btnEn');
      [btnZh,btnDe,btnEn].forEach(function(b){ b.classList.remove('active'); });
      ({ zh:btnZh, de:btnDe, en:btnEn }[lang] || btnZh).classList.add('active');
    });
  </script>
</body>
</html>
