<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MVP3 Quote Compare</title>

  <style>
    body { font-family: sans-serif; margin: 1em; }
    #langSwitcher { margin-bottom: 1em; display: flex; gap: 8px; }
    #langSwitcher button { padding: 4px 8px; }
  </style>

  <!-- 仅加载我们放在 /frontend/public 下的轻量增强样式/脚本；不加载 /assets/*.js -->
  <link rel="stylesheet" href="/ui-enhance.css?v=34" />
</head>
<body>

  <!-- 语言切换（只设置语言，不改 UI 文案；文案由 i18n.js 在页面运行后替换） -->
  <div id="langSwitcher">
    <button onclick="i18n.setLang('zh')">CN 中文</button>
    <button onclick="i18n.setLang('de')">DE Deutsch</button>
    <button onclick="i18n.setLang('en')">GB English</button>
  </div>

  <!-- 挂载区：这里如果后续切回 Vite 构建，可以作为 React root -->
  <div id="root"></div>

  <!-- 语言相关（安全）-->
  <script src="/i18n.js?v=34"></script>
  <script src="/lang-fetch.js?v=34"></script>

  <!-- UI 增强脚本（隐藏开发块/按钮行/API 基址/原始 JSON；?dev=1 显示） -->
  <script src="/ui-enhance.js?v=34"></script>

  <!-- ！！！不要引入 Vite 构建产物；否则白屏
  <script type="module" crossorigin src="/assets/index-xxxx.js"></script>
  -->
</body>
</html>
