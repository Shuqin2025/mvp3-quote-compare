<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>云贸星 · 智能表格生成器</title>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
  <style>
    body { background:#fafafa; font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial; }
    .wrap { max-width:980px; margin:0 auto; padding:32px 20px; }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .btn { height:40px; padding:0 14px; border:1px solid #ddd; border-radius:8px; background:#fff; cursor:pointer; }
    .btn.primary { background:#2563eb; color:#fff; border-color:#2563eb; }
    .btn:disabled { opacity: .6; cursor:not-allowed; }
    .input { min-width:320px; flex:1; height:40px; padding:0 12px; border:1px solid #ddd; border-radius:8px; }
    .card { margin-top:16px; border:1px solid #e5e7eb; border-radius:10px; background:#fff; }
    .card-head { padding:10px 14px; border-bottom:1px solid #eee; color:#666; font-size:14px; }
    .card-body { min-height:420px; overflow:auto; padding:8px; }
    table { width:100%; border-collapse:collapse; }
    th, td { border:1px solid #eee; padding:6px 8px; vertical-align:top; }
    th { background:#fafafa; }
    a { color:#2563eb; text-decoration:none; }
    a:hover { text-decoration:underline; }
    .alert { margin-top:12px; border-radius:8px; padding:10px 12px; font-size:14px; }
    .alert.ok { background:#e8f5e9; border:1px solid #c8e6c9; color:#2e7d32; }
    .alert.info { background:#fff8e1; border:1px solid #ffe082; color:#6b5900; }
    img.thumb { width:72px; height:72px; object-fit:contain; background:#f8f8f8; border:1px solid #eee; border-radius:6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="row" id="langbar">
      <button class="btn" data-lang="zh">CN 中文</button>
      <button class="btn" data-lang="de">DE Deutsch</button>
      <button class="btn" data-lang="en">GB English</button>
    </div>

    <h1 id="title" style="margin:16px 0 4px; font-size:24px; font-weight:700">云贸星 智能表格生成器</h1>
    <div id="subtitle" style="color:#6b7280">输入目录型网页链接，秒生成 Excel 产品表格。</div>

    <div class="row" style="margin-top:16px">
      <input id="txtUrl" class="input" placeholder="在此粘贴目录型页面链接（例如某一类目的商品列表页）">
      <button id="btnFetch" class="btn primary">抓取目录</button>
      <select id="limit" class="btn"><option>50</option><option>100</option><option>200</option></select>
      <button id="btnExport" class="btn">导出 Excel（.xlsx）</button>
      <button id="btnClear" class="btn">清空数据</button>
    </div>

    <div id="status" class="alert info">ui_no_data</div>
    <div id="okbar" class="alert ok" style="display:none"></div>

    <div class="card">
      <div class="card-head" id="theadNote">—</div>
      <div class="card-body">
        <table id="tbl">
          <thead>
            <tr>
              <th>#</th>
              <th id="thSku">Item No.</th>
              <th id="thPic">Picture</th>
              <th id="thDesc">Description</th>
              <th>MOQ</th>
              <th id="thPrice">Unit Price</th>
              <th>Link</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="row" style="margin-top:24px; color:#6b7280; font-size:14px">
      <a href="#">支持的网站</a>
      <a href="#">隐私政策</a>
      <a href="#">联系我们</a>
    </div>
  </div>

  <script>
    // ==============================
    // 后端基址：只写一次，不再拼两个地址导致 “%20与%20” 的错误
    // ==============================
    const API_BASE = "https://yunivera-gateway.onrender.com";     // 你的 Render 网关
    const API = {
      parse:   (u,limit)=> `${API_BASE}/v1/api/catalog/parse?url=${encodeURIComponent(u)}&limit=${limit}`,
      exportG: (u,limit)=> `${API_BASE}/v1/export-xlsx?url=${encodeURIComponent(u)}&limit=${limit}`, // 兼容别名
      exportF: (u,limit)=> `${API_BASE}/v1/api/export-xlsx?url=${encodeURIComponent(u)}&limit=${limit}`, // 失败回退
      image:   (u)=> `${API_BASE}/v1/api/image?format=raw&url=${encodeURIComponent(u)}` // 图片统一用代理，避免懒加载/CORS
    };

    // 简易 i18n
    const I18N = {
      zh: {
        title:'云贸星 智能表格生成器', sub:'输入目录型网页链接，秒生成 Excel 产品表格。',
        fetch:'抓取目录', export:'导出 Excel（.xlsx）', clear:'清空数据',
        thSku:'货号', thPic:'图片', thDesc:'描述', thPrice:'单价', open:'打开', noUrl:'请输入目录页链接',
        fetching:'抓取中…', fetched:'抓取完成', exportIng:'导出中…', exported:'已触发下载', cleared:'已清空',
      },
      en: {
        title:'Yunivera · Table Maker', sub:'Paste a category/list URL to export product table.',
        fetch:'Fetch', export:'Export .xlsx', clear:'Clear',
        thSku:'Item No.', thPic:'Picture', thDesc:'Description', thPrice:'Unit Price', open:'Open', noUrl:'Please input a URL',
        fetching:'Fetching…', fetched:'Done', exportIng:'Exporting…', exported:'Download started', cleared:'Cleared',
      },
      de: {
        title:'Yunivera · Tabellengenerator', sub:'Fügen Sie eine Katalog-/Listen-URL ein.',
        fetch:'Abrufen', export:'Export (.xlsx)', clear:'Leeren',
        thSku:'Artikel-Nr.', thPic:'Bild', thDesc:'Beschreibung', thPrice:'Preis', open:'Öffnen', noUrl:'Bitte URL eingeben',
        fetching:'Lädt…', fetched:'Fertig', exportIng:'Exportiert…', exported:'Download gestartet', cleared:'Geleert',
      }
    };
    let lang = 'zh';
    const $ = sel => document.querySelector(sel);
    const tbody = $('#tbl tbody');
    const statusBar = $('#status');
    const okbar = $('#okbar');
    const btnFetch = $('#btnFetch');
    const btnExport = $('#btnExport');

    function setLang(code){
      lang = I18N[code] ? code : 'zh';
      const t = I18N[lang];
      $('#title').textContent = t.title;
      $('#subtitle').textContent = t.sub;
      btnFetch.textContent = t.fetch;
      btnExport.textContent = t.export;
      $('#btnClear').textContent = t.clear;
      $('#thSku').textContent = t.thSku;
      $('#thPic').textContent = t.thPic;
      $('#thDesc').textContent = t.thDesc;
      $('#thPrice').textContent = t.thPrice;
    }
    $('#langbar').addEventListener('click', e=>{
      const code = e.target?.dataset?.lang;
      if(code) setLang(code);
    });
    setLang('zh');

    function setStatus(msg, ok=false) {
      statusBar.className = 'alert ' + (ok ? 'ok' : 'info');
      statusBar.textContent = msg;
      if (ok) { okbar.style.display = 'block'; okbar.textContent = msg; }
      else okbar.style.display = 'none';
    }

    function rowHtml(i, it) {
      // 图片统一走后端代理，自动把 webp/lazy 处理掉
      const imgUrl = it.img ? API.image(it.img) : '';
      const img = it.img ? `<img class="thumb" src="${imgUrl}" alt="">` : '';
      const link = it.url ? `<a href="${it.url}" target="_blank">${I18N[lang].open}</a>` : '';
      return `<tr>
        <td>${i+1}</td>
        <td>${it.sku||''}</td>
        <td>${img}</td>
        <td>${it.title||it.desc||''}</td>
        <td>${it.moq||''}</td>
        <td>${it.price||''}</td>
        <td>${link}</td>
      </tr>`;
    }

    function toggleBusy(b){
      btnFetch.disabled = b; btnExport.disabled = b;
      $('#txtUrl').disabled = b; $('#limit').disabled = b;
    }

    async function fetchCatalog() {
      try {
        const url = $('#txtUrl').value.trim();
        const limit = parseInt($('#limit').value,10) || 50;
        if (!url) return setStatus(I18N[lang].noUrl);

        setStatus(I18N[lang].fetching); toggleBusy(true);
        const api = API.parse(url,limit);
        console.log('[GET]', api);
        const r = await fetch(api, { mode:'cors' });
        if (!r.ok) throw new Error('HTTP '+r.status);
        const data = await r.json();

        tbody.innerHTML = '';
        const rows = Array.isArray(data?.rows) ? data.rows : (Array.isArray(data?.items) ? data.items : []);
        rows.forEach((it, i) => tbody.insertAdjacentHTML('beforeend', rowHtml(i, it)));

        $('#theadNote').textContent = `Adapter: ${data?.adapter||'-'} | Count: ${rows.length}`;
        setStatus(I18N[lang].fetched, true);
      } catch (e) {
        console.error(e);
        setStatus('抓取失败：'+ (e?.message || e));
      } finally {
        toggleBusy(false);
      }
    }

    // GET 下载；若别名 /v1/export-xlsx 仍被网关阻拦，自动回退到 /v1/api/export-xlsx
    async function exportToXlsx() {
      try {
        const url = $('#txtUrl').value.trim();
        const limit = parseInt($('#limit').value,10) || 50;
        if (!url) return setStatus(I18N[lang].noUrl);
        setStatus(I18N[lang].exportIng); toggleBusy(true);

        const tryOnce = async (href) => {
          return new Promise((resolve,reject)=>{
            // 直接创建 a 链接触发下载
            const a = document.createElement('a');
            a.href = href;
            a.download = 'catalog.xlsx';
            // 一些浏览器会静默失败，我们用 3 秒超时兜底
            const timer = setTimeout(()=>reject(new Error('timeout')), 3000);
            a.onclick = ()=> clearTimeout(timer);
            document.body.appendChild(a); a.click(); a.remove();
            // 不阻塞：假定成功
            resolve(true);
          });
        };

        try {
          await tryOnce(API.exportG(url,limit));
        } catch {
          await tryOnce(API.exportF(url,limit)); // 回退
        }
        setStatus(I18N[lang].exported, true);
      } catch (e) {
        console.error(e);
        setStatus('导出失败：' + (e?.message || e));
      } finally {
        toggleBusy(false);
      }
    }
    window.exportToXlsx = exportToXlsx;

    $('#btnFetch').addEventListener('click', fetchCatalog);
    $('#btnExport').addEventListener('click', exportToXlsx);
    $('#btnClear').addEventListener('click', () => { tbody.innerHTML = ''; setStatus(I18N[lang].cleared); });

    // 观察新增的 <tr>，去除图片 loading=lazy（避免预览空白）
    (() => {
      if (tbody && 'MutationObserver' in window) {
        const observer = new MutationObserver(muts => {
          for (const mut of muts) for (const node of mut.addedNodes) {
            if (node.tagName === 'TR') {
              const img = node.querySelector('img');
              if (img && img.hasAttribute('loading')) img.removeAttribute('loading');
            }
          }
        });
        observer.observe(tbody, { childList: true });
      }
    })();
  </script>
</body>
</html>
