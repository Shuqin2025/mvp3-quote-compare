<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title data-i18n="app.title">云贸星 智能表格生成器</title>

  <!-- 样式 -->
  <link rel="stylesheet" href="/ui-enhance.css?v=36" />

  <!-- 加载字典：注意不要加 /public 前缀 -->
  <script src="/i18n.js?v=1"></script>

  <style>
    :root{
      --border:#e5e7eb; --muted:#6b7280; --bg:#fff;
      --okbg:#E8F5E9; --okbd:#C8E6C9; --warnbg:#FFF8E1; --warnbd:#FFECB3;
      --primary:#2563eb; --primary-d:#1d4ed8;
    }
    *{box-sizing:border-box}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans",sans-serif;margin:0;background:#fafafa;color:#111}
    .wrap{max-width:1200px;margin:20px auto;padding:0 16px}
    .langbar{display:flex;gap:8px;margin-bottom:16px}
    .btn{padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;cursor:pointer}
    .btn:hover{background:#f8fafc}
    .btn-primary{background:var(--primary);border-color:var(--primary-d);color:#fff}
    .btn-primary:hover{filter:brightness(0.97)}
    .btn-ghost{background:#f8fafc}
    .title{font-size:28px;font-weight:800;margin:6px 0 2px}
    .subtitle{font-size:14px;color:#666;margin:0 0 16px}
    .card{border:1px solid var(--border);border-radius:12px;background:#fff;padding:12px}
    .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
    .input{flex:1;min-width:320px;padding:9px 10px;border:1px solid var(--border);border-radius:10px;background:#fff}
    select.btn{padding:8px 10px}
    .alert{padding:10px 12px;border-radius:10px;margin:8px 0;display:none}
    .alert-ok{background:var(--okbg);border:1px solid var(--okbd)}
    .alert-warn{background:var(--warnbg);border:1px solid var(--warnbd)}
    .result-box{min-height:420px;background:#fff;border:1px dashed #ddd;border-radius:12px;padding:10px}
    table{width:100%;border-collapse:collapse;background:#fff}
    thead th{background:#fafafa}
    th,td{border-bottom:1px solid #eee;padding:8px;vertical-align:top}
    th{font-weight:600}
    .muted{color:#9ca3af}
    footer{margin-top:28px;color:#666;font-size:13px;display:flex;gap:16px}
    footer a{color:#3b82f6;text-decoration:none}
    footer a:hover{text-decoration:underline}
  </style>
</head>

<body>
<div class="wrap">

  <!-- 语言切换按钮 -->
  <div class="langbar">
    <button class="btn btn-ghost" onclick="setLangSafe('zh')">中文</button>
    <button class="btn btn-ghost" onclick="setLangSafe('de')">DE</button>
    <button class="btn btn-ghost" onclick="setLangSafe('en')">EN</button>
  </div>

  <!-- 标题 / 副标题 -->
  <div class="title" data-i18n="app.title">云贸星 智能表格生成器</div>
  <p class="subtitle" data-i18n="app.subtitle">输入目录型网页链接，秒生成 Excel 产品表格。</p>

  <div class="card">
    <div class="toolbar">
      <input id="txtUrl" class="input" data-i18n-ph="ui.input_placeholder"
             placeholder="在此粘贴目录型页面链接（例如某一类目的商品列表页）" />
      <button id="btnFetch" class="btn btn-primary" data-i18n="ui.fetch_btn">抓取目录</button>

      <select id="selPreview" class="btn" title="Preview size">
        <option value="50">50</option>
        <option value="100">100</option>
      </select>

      <button id="btnExport" class="btn" data-i18n="ui.export_btn">导出 Excel（.xlsx）</button>
      <button id="btnClear" class="btn" data-i18n="ui.clear_btn">清空数据</button>
    </div>

    <div id="toast" class="alert"></div>

    <div class="result-box" id="resultBox">
      <table id="tbl" style="display:none;">
        <thead>
          <tr>
            <th>#</th>
            <th>Item No.</th>
            <th>Picture</th>
            <th>Description</th>
            <th>MOQ</th>
            <th>Unit Price</th>
            <th data-i18n="ui.link_text">链接</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="empty" class="muted" data-i18n="ui.no_data">暂无数据</div>
    </div>
  </div>

  <footer>
    <a href="#" target="_blank" data-i18n="footer.support">支持的网站</a>
    <a href="#" target="_blank" data-i18n="footer.privacy">隐私政策</a>
    <a href="#" target="_blank" data-i18n="footer.contact">联系我们</a>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

<script>
  function setLangSafe(code){
    try{
      if (window.i18n){
        if (typeof i18n.set === 'function')      i18n.set(code);
        else if (typeof i18n.setLang === 'function') i18n.setLang(code);
        else { i18n.lang = code; if (typeof i18n.apply === 'function') i18n.apply(); }
      }
      applyI18n();
      window.dispatchEvent(new Event('langchange'));
    }catch(e){ console.warn('[setLangSafe]', e); }
  }
  function applyI18n(){
    if (!window.i18n) return;
    document.querySelectorAll('[data-i18n]').forEach(el=>{
      const key = el.getAttribute('data-i18n');
      const txt = (i18n.t ? i18n.t(key) : key);
      if (txt) el.textContent = txt;
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(el=>{
      const key = el.getAttribute('data-i18n-ph');
      const txt = (i18n.t ? i18n.t(key) : key);
      if (txt) el.setAttribute('placeholder', txt);
    });
    const titleEl = document.querySelector('title[data-i18n="app.title"]');
    if (titleEl && i18n.t) titleEl.textContent = i18n.t('app.title');
  }
  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', applyI18n);
  }else{
    applyI18n();
  }
  window.addEventListener('langchange', applyI18n);
</script>

<!-- 确保 ui-enhance.js 最后加载 -->
<script src="/ui-enhance.js?v=36" onerror="console.error('ui-enhance.js 加载失败')"></script>

</body>
</html>
