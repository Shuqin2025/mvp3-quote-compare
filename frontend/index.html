<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- 允许 ?api= 覆盖；否则读这里；再否则回退 /v1/api -->
  <meta name="api-base" content="https://yunivera-gateway.onrender.com/v1/api" />
  <meta name="ui-enhance" content="on" />
  <title>云贸星 · 智能表格生成器</title>
</head>
<body>
  <!-- 可选增强开关 & 可配置导出模块（从 frontend/ 下看相对路径） -->
  <script>
    window.UI_ENHANCE = {
      enhance: true,
      exportModule: './export-xlsx.js'   // ← 这里指向 frontend/export-xlsx.js
    };
  </script>

  <!-- 一定要用相对路径：index.html 在 frontend/，脚本在 frontend/public/ -->
  <script type="module" src="./public/ui-enhance.plus.js?enhance=1"></script>
</body>
</html>
