<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MVP3 — App</title>

  <link rel="stylesheet" href="/ui-enhance.css?v=36" />
  <style>
    body{font-family:sans-serif;margin:16px}
    #langSwitcher{display:flex;gap:8px;margin:8px 0 12px}
    #resultBox{min-height:420px;background:
      repeating-linear-gradient(45deg,#f7f7f7 0,#f7f7f7 10px,#f0f0f0 10px,#f0f0f0 20px);
      border:1px dashed #ddd;border-radius:8px;padding:16px}
    table{width:100%;border-collapse:collapse}
    th,td{border-bottom:1px solid #eee;padding:8px;text-align:left;vertical-align:top}
    th{background:#fafafa;font-weight:600}
    .link{color:#3b82f6;text-decoration:underline;cursor:pointer}
  </style>

  <!-- i18n & UI scripts -->
  <script src="/i18n.js?v=36"></script>
  <script src="/ui-enhance.js?v=36"></script>

  <!-- ExcelJS（用于真正把图片嵌入 xlsx） -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <!-- FileSaver.js（下载 xlsx） -->
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
</head>
<body>
  <div id="langSwitcher">
    <button onclick="i18n.setLang('zh')">CN 中文</button>
    <button onclick="i18n.setLang('de')">DE Deutsch</button>
    <button onclick="i18n.setLang('en')">GB English</button>
  </div>

  <div id="root"></div>

  <!-- Vite/React 入口 -->
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
