<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Yunivera DataBridge</title>

  <!-- 样式 -->
  <link rel="stylesheet" href="/ui-enhance.css?v=36" />

  <!-- 三语言字典 -->
  <script src="/i18n.js?v=1"></script>

  <style>
    :root{
      --border:#e5e7eb; --muted:#6b7280; --bg:#fff; --okbg:#E8F5E9; --okbd:#C8E6C9; --warnbg:#FFF8E1; --warnbd:#FFECB3;
      --primary:#2563eb; --primary-d:#1d4ed8;
    }
    *{box-sizing:border-box}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,'Noto Sans',sans-serif;margin:16px;background:#fafafa;color:#111}
    .langbar{display:flex;gap:8px;margin-bottom:8px;}
    .btn{padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;cursor:pointer}
    .btn:hover{background:#f8fafc}
    .btn-primary{background:var(--primary);border-color:var(--primary-d);color:#fff}
    .btn-primary:hover{filter:brightness(0.97)}
    .btn-ghost{background:#f8fafc}
    .title{font-size:28px;font-weight:800;margin:6px 0 2px}
    .subtitle{font-size:14px;color:#666;margin:0 0 16px}
    .card{border:1px solid var(--border);border-radius:12px;background:#fff;padding:12px}
    .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
    .input{flex:1;min-width:320px;padding:9px 10px;border:1px solid var(--border);border-radius:10px;background:#fff}
    select.btn{padding:8px 10px}
    .alert{padding:10px 12px;border-radius:10px;margin:8px 0}
    .alert-ok{background:var(--okbg);border:1px solid var(--okbd)}
    .alert-warn{background:var(--warnbg);border:1px solid var(--warnbd)}
    .result-box{min-height:420px;background:repeating-linear-gradient(45deg,#f7f7f7 0,#f7f7f7 10px,#f0f0f0 10px,#f0f0f0 20px);
      border:1px dashed #ddd;border-radius:12px;padding:10px}
    table{width:100%;border-collapse:collapse;background:#fff}
    thead th{background:#fafafa}
    th,td{border-bottom:1px solid #eee;padding:8px;vertical-align:top}
    th{font-weight:600}
    .muted{color:#9ca3af}
    footer{margin-top:28px;color:#666;font-size:13px;display:flex;gap:16px}
    footer a{color:#3b82f6;text-decoration:none}
    footer a:hover{text-decoration:underline}
  </style>
</head>
<body>

  <!-- 语言切换 -->
  <div class="langbar">
    <button class="btn btn-ghost" onclick="i18n.set('zh')" data-i18n="lang_cn">CN 中文</button>
    <button class="btn btn-ghost" onclick="i18n.set('de')" data-i18n="lang_de">DE Deutsch</button>
    <button class="btn btn-ghost" onclick="i18n.set('en')" data-i18n="lang_en">GB English</button>
  </div>

  <!-- 标题 & 副标题（随语言切换） -->
  <div class="title" data-i18n="title">Yunivera DataBridge</div>
  <p class="subtitle" data-i18n="subtitle">输入目录型网页链接，秒生成 Excel 产品表格。</p>

  <!-- 工具栏 & 反馈 & 结果 -->
  <div class="card">
    <div class="toolbar">
      <input id="txtUrl" class="input"
             data-i18n-ph="input_placeholder"
             placeholder="在此粘贴目录型页面链接（例如某一类目的商品列表页）" />
      <button id="btnFetch" class="btn btn-primary" data-i18n="btn_fetch">抓取目录</button>

      <select id="selPreview" class="btn" title="Preview size">
        <option value="50">50</option>
        <option value="100">100</option>
      </select>

      <button id="btnExport" class="btn" data-i18n="btn_export">导出 Excel（.xlsx）</button>
      <button id="btnClear" class="btn" data-i18n="btn_clear">清空数据</button>
    </div>

    <!-- 状态提示 -->
    <div id="toast" class="alert alert-ok" style="display:none;"></div>

    <!-- 数据表区域 -->
    <div class="result-box" id="resultBox">
      <table id="tbl" style="display:none;">
        <thead>
          <tr>
            <th>#</th>
            <th>Item No.</th>
            <th>Picture</th>
            <th>Description</th>
            <th>MOQ</th>
            <th>Unit Price</th>
            <th data-i18n="link_text">链接</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="empty" class="muted" data-i18n="no_data">暂无数据</div>
    </div>
  </div>

  <!-- 页脚 -->
  <footer>
    <a href="#" target="_blank" data-i18n="footer_support">支持的网站</a>
    <a href="#" target="_blank" data-i18n="footer_privacy">隐私政策</a>
    <a href="#" target="_blank" data-i18n="footer_contact">联系我们</a>
  </footer>

  <!-- 必须：先引入 ExcelJS 与 FileSaver（CDN），再引入业务脚本 -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
  <script src="/ui-enhance.js?v=36"></script>

  <script>
    // 应用多语言文本
    i18n.apply();

    const $toast = document.getElementById('toast');
    const $tbl   = document.getElementById('tbl');
    const $tbody = document.getElementById('tbody');
    const $empty = document.getElementById('empty');

    function showToast(ok, text){
      $toast.className = 'alert ' + (ok ? 'alert-ok' : 'alert-warn');
      $toast.style.display = 'block';
      $toast.textContent = text;
    }
    function hideToast(){ $toast.style.display = 'none'; }

    // 提供给 ui-enhance.js 调用的渲染函数
    window.renderRows = function(rows){
      $tbody.innerHTML = '';
      const m = document.getElementById('selPreview').value;

      if (!rows || !rows.length){
        $tbl.style.display = 'none';
        $empty.style.display = 'block';
        showToast(true, i18n.t('toast_zero', { m }));
        return;
      }

      rows.forEach((r, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${i+1}</td>
          <td>${r.sku || ''}</td>
          <td>${r.img ? `<img src="${r.img}" style="height:36px">` : ''}</td>
          <td>${r.title || ''}</td>
          <td>${r.moq ?? ''}</td>
          <td>${r.price ?? ''}</td>
          <td>${r.url ? `<a href="${r.url}" target="_blank">${i18n.t('link_text')}</a>` : ''}</td>
        `;
        $tbody.appendChild(tr);
      });

      $empty.style.display = 'none';
      $tbl.style.display   = 'table';
      showToast(true, i18n.t('toast_success', { n: rows.length, m }));
    };

    // 清空数据
    document.getElementById('btnClear').addEventListener('click', () => {
      $tbody.innerHTML = '';
      $tbl.style.display = 'none';
      $empty.style.display = 'block';
      hideToast();
      // 可选：清空输入
      // document.getElementById('txtUrl').value = '';
    });
  </script>
</body>
</html>
