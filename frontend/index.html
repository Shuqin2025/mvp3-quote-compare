<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title data-i18n="app.title">云贸星 智能表格生成器</title>

  <!-- 样式 -->
  <link rel="stylesheet" href="/ui-enhance.css?v=36" />

  <!-- 先加载字典（注意：不要带 /public 前缀） -->
  <script src="/i18n.js?v=1"></script>
</head>
<body>
  <div class="wrap">

    <!-- 语言按钮：只改显示文本为 中文 / DE / EN -->
    <div class="langbar" style="display:flex;gap:8px;margin:16px 0 8px;">
      <button class="btn btn-ghost" onclick="setLangSafe('zh')">中文</button>
      <button class="btn btn-ghost" onclick="setLangSafe('de')">DE</button>
      <button class="btn btn-ghost" onclick="setLangSafe('en')">EN</button>
    </div>

    <!-- 标题 / 副标题 -->
    <h1 class="title" data-i18n="app.title" style="margin:6px 0 2px;font-size:28px;font-weight:800;">
      云贸星 智能表格生成器
    </h1>
    <p class="subtitle" data-i18n="app.subtitle" style="margin:0 0 16px;color:#666;">
      输入目录型网页链接，秒生成 Excel 产品表格。
    </p>

    <!-- 工具栏 -->
    <div class="card" style="border:1px solid #e5e7eb;border-radius:12px;padding:12px;background:#fff;">
      <div class="toolbar" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px;">
        <input id="txtUrl" class="input" data-i18n-ph="ui.input_placeholder"
               placeholder="在此粘贴目录型页面链接（例如某一类目的商品列表页）"
               style="flex:1;min-width:320px;padding:9px 10px;border:1px solid #e5e7eb;border-radius:10px;" />
        <button id="btnFetch" class="btn btn-primary" data-i18n="ui.fetch_btn"
                style="padding:8px 12px;border-radius:10px;background:#2563eb;color:#fff;border:1px solid #1d4ed8;">
          抓取目录
        </button>

        <select id="selPreview" class="btn" title="Preview size"
                style="padding:8px 10px;border:1px solid #e5e7eb;border-radius:10px;background:#fff;">
          <option value="50">50</option>
          <option value="100">100</option>
        </select>

        <button id="btnExport" class="btn" data-i18n="ui.export_btn"
                style="padding:8px 12px;border:1px solid #e5e7eb;border-radius:10px;background:#fff;">
          导出 Excel（.xlsx）
        </button>
        <button id="btnClear" class="btn" data-i18n="ui.clear_btn"
                style="padding:8px 12px;border:1px solid #e5e7eb;border-radius:10px;background:#fff;">
          清空数据
        </button>
      </div>

      <!-- 提示条 -->
      <div id="toast" class="alert" style="display:none;padding:10px 12px;border-radius:10px;margin:8px 0;"></div>

      <!-- 结果区域 -->
      <div class="result-box" id="resultBox"
           style="min-height:420px;border:1px dashed #ddd;border-radius:12px;padding:10px;background:#fff;">
        <table id="tbl" style="width:100%;border-collapse:collapse;background:#fff;display:none;">
          <thead>
            <tr style="background:#fafafa;">
              <th style="padding:8px;border-bottom:1px solid #eee;">#</th>
              <th style="padding:8px;border-bottom:1px solid #eee;">Item No.</th>
              <th style="padding:8px;border-bottom:1px solid #eee;">Picture</th>
              <th style="padding:8px;border-bottom:1px solid #eee;">Description</th>
              <th style="padding:8px;border-bottom:1px solid #eee;">MOQ</th>
              <th style="padding:8px;border-bottom:1px solid #eee;">Unit Price</th>
              <th style="padding:8px;border-bottom:1px solid #eee;" data-i18n="ui.link_text">链接</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <div id="empty" class="muted" data-i18n="ui.no_data" style="color:#9ca3af;">暂无数据</div>
      </div>
    </div>

    <!-- 页脚 -->
    <footer style="margin-top:28px;color:#666;font-size:13px;display:flex;gap:16px;">
      <a href="#" target="_blank" data-i18n="footer.support" style="color:#3b82f6;text-decoration:none;">支持的网站</a>
      <a href="#" target="_blank" data-i18n="footer.privacy" style="color:#3b82f6;text-decoration:none;">隐私政策</a>
      <a href="#" target="_blank" data-i18n="footer.contact" style="color:#3b82f6;text-decoration:none;">联系我们</a>
    </footer>
  </div>

  <!-- 依赖库（与之前一致） -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

  <!-- 主脚本：放在字典之后 -->
  <script src="/ui-enhance.js?v=36"></script>

  <!-- 放在最底部：保证 setLangSafe / applyI18n 可用 -->
  <script>
    function setLangSafe(code){
      try{
        if (window.i18n){
          if (typeof i18n.set === 'function') i18n.set(code);
          else if (typeof i18n.setLang === 'function') i18n.setLang(code);
          else { i18n.lang = code; if (typeof i18n.apply === 'function') i18n.apply(); }
        }
        applyI18n();
        window.dispatchEvent(new Event('langchange'));
      }catch(e){ console.warn('[setLangSafe]', e); }
    }

    function applyI18n(){
      if (!window.i18n) return;

      document.querySelectorAll('[data-i18n]').forEach(el=>{
        const key = el.getAttribute('data-i18n');
        const txt = (i18n.t ? i18n.t(key) : key);
        if (txt != null) el.textContent = txt;
      });

      document.querySelectorAll('[data-i18n-ph]').forEach(el=>{
        const key = el.getAttribute('data-i18n-ph');
        const txt = (i18n.t ? i18n.t(key) : key);
        if (txt != null) el.setAttribute('placeholder', txt);
      });

      const titleEl = document.querySelector('title[data-i18n="app.title"]');
      if (titleEl && i18n.t) titleEl.textContent = i18n.t('app.title');
    }

    if (document.readyState === 'loading'){
      document.addEventListener('DOMContentLoaded', applyI18n);
    }else{
      applyI18n();
    }
    window.addEventListener('langchange', applyI18n);
  </script>
</body>
</html>
