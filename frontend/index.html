<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>云贸星 智能表格生成器 · Yunivera DataBridge</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    :root{--bg:#fff;--text:#111;--muted:#6b7280;--brand:#111827}
    *{box-sizing:border-box}
    body{margin:0;background:#fafafa;color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans",sans-serif}
    .wrap{max-width:1160px;margin:0 auto;padding:18px 16px 28px}
    .langbar{display:flex;gap:8px;margin-bottom:10px}
    .langbar button{padding:6px 10px;border:1px solid #e5e7eb;background:#fff;border-radius:8px;cursor:pointer}
    .langbar button.active{background:#2563eb;color:#fff;border-color:#2563eb}
    h1{margin:4px 0 2px;font-size:26px;font-weight:800;color:var(--brand)}
    .subtitle{margin:0 0 14px;color:var(--muted)}
    .toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
    .toolbar input[type="text"]{flex:1;padding:10px 12px;border:1px solid #e5e7eb;border-radius:8px;outline:none}
    .toolbar select,.toolbar button{height:38px;border-radius:8px;border:1px solid #e5e7eb;background:#fff;padding:0 10px;cursor:pointer}
    .toolbar .primary{background:#2563eb;border-color:#2563eb;color:#fff}
    .panel{background:#fff;border:1px solid #e5e7eb;border-radius:10px}
    /* 结果区：强制为纯白，无底纹 */
    #panel-body{min-height:360px;background:#fff;border-radius:10px}
    table{width:100%;border-collapse:collapse}
    th,td{padding:10px;border-bottom:1px solid #f1f5f9;text-align:left;vertical-align:middle}
    th{font-weight:700}
    .muted{color:var(--muted)}
    /* toast */
    .toast{margin:10px 0 0;background:#fef3c7;border:1px solid #fde68a;color:#92400e;padding:10px 12px;border-radius:8px;display:none}
    .toast.show{display:block}
    /* footer */
    footer{margin-top:14px;color:#6b7280}
    footer a{color:#2563eb;text-decoration:none;margin-right:14px}
  </style>
</head>
<body>
  <div class="wrap">
    <!-- 语言切换 -->
    <div class="langbar" id="langbar">
      <button data-lang="zh" id="btn-zh">CN 中文</button>
      <button data-lang="de" id="btn-de">DE Deutsch</button>
      <button data-lang="en" id="btn-en">GB English</button>
    </div>

    <!-- 标题与副标题（全部交给 i18n 填充） -->
    <h1 id="app-title">云贸星 智能表格生成器</h1>
    <p class="subtitle" id="app-subtitle">输入目录型网页链接，秒生成 Excel 产品表格。</p>

    <!-- 工具栏 -->
    <div class="toolbar">
      <input id="urlInput" type="text" autocomplete="off"
             placeholder="在此粘贴目录型页面链接（例如某一类目的商品列表页）" />
      <button id="btnFetch" class="primary"></button>
      <select id="limit">
        <option>50</option><option>100</option><option>200</option>
      </select>
      <button id="btnExport"></button>
      <button id="btnClear"></button>
    </div>

    <!-- 提示 -->
    <div id="toast" class="toast"></div>

    <!-- 数据表：ui-enhance.js 依赖这些 ID，请勿改动 -->
    <div class="panel">
      <div id="panel-body">
        <table id="table" aria-label="result" style="width:100%">
          <thead>
            <tr>
              <th class="muted" style="width:48px">#</th>
              <th id="th-sku" style="width:120px">Item No.</th>
              <th id="th-pic" style="width:120px">Picture</th>
              <th id="th-desc">Description</th>
              <th id="th-moq" style="width:110px">MOQ</th>
              <th id="th-price" style="width:120px">Unit Price</th>
              <th id="th-link" style="width:120px"></th>
            </tr>
          </thead>
          <tbody id="rows"><!-- 行由 JS 渲染 --></tbody>
        </table>
      </div>
    </div>

    <!-- 页脚 -->
    <footer>
      <a id="footer-sites" href="#" target="_blank" rel="noopener">支持的网站</a>
      <a id="footer-privacy" href="#" target="_blank" rel="noopener">隐私政策</a>
      <a id="footer-contact" href="#" target="_blank" rel="noopener">联系我们</a>
    </footer>
  </div>

  <!-- 脚本（务必与后端静态路径一致） -->
  <script defer src="/public/i18n.js"></script>
  <script defer src="/public/ui-enhance.js"></script>

  <!-- 页面词条键，ui-enhance.js 会读取这些 ID 并调用 i18n.t(key) 设置文案 -->
  <script>
    // 这些 key 必须与 /public/i18n.js 中字典一致
    window.__I18N_BINDINGS__ = {
      title: 'app.title',                // 云贸星 智能表格生成器 / Yunivera DataBridge
      subtitle: 'app.subtitle',          // 副标题
      inputPlaceholder: 'app.input.placeholder',
      btnFetch: 'app.btn.fetch',
      btnExport: 'app.btn.export',
      btnClear: 'app.btn.clear',
      thSku: 'table.col.sku',
      thPic: 'table.col.pic',
      thDesc: 'table.col.desc',
      thMoq: 'table.col.moq',
      thPrice: 'table.col.price',
      thLink: 'table.col.link',
      footerSites: 'app.footer.sites',
      footerPrivacy: 'app.footer.privacy',
      footerContact: 'app.footer.contact'
    };

    // 把元素引用暴露给 ui 脚本（避免 querySelector 失败）
    window.__UI_ANCHORS__ = {
      urlInput: document.getElementById('urlInput'),
      btnFetch: document.getElementById('btnFetch'),
      btnExport: document.getElementById('btnExport'),
      btnClear: document.getElementById('btnClear'),
      limit: document.getElementById('limit'),
      toast: document.getElementById('toast'),
      rows: document.getElementById('rows'),
      appTitle: document.getElementById('app-title'),
      appSubtitle: document.getElementById('app-subtitle'),
      thSku: document.getElementById('th-sku'),
      thPic: document.getElementById('th-pic'),
      thDesc: document.getElementById('th-desc'),
      thMoq: document.getElementById('th-moq'),
      thPrice: document.getElementById('th-price'),
      thLink: document.getElementById('th-link'),
      footerSites: document.getElementById('footer-sites'),
      footerPrivacy: document.getElementById('footer-privacy'),
      footerContact: document.getElementById('footer-contact')
    };
  </script>
</body>
</html>
