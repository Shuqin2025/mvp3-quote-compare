<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>MVP3 — App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- 简单样式 -->
  <style>
    :root { --bg:#f8fafc; --card:#fff; --text:#111827; --muted:#6b7280; --brand:#2563eb; --border:#e5e7eb; }
    * { box-sizing: border-box; }
    body { margin:0; font: 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Heiti SC",sans-serif; color:var(--text); background:var(--bg); }
    header { padding: 16px 20px; border-bottom: 1px solid var(--border); background:#fff; position:sticky; top:0; z-index:10;}
    h1 { margin:0 0 6px 0; font-size: 22px; }
    .tips { background:#ecfdf5; border:1px solid #10b98133; color:#065f46; padding:10px 12px; border-radius:8px; margin:16px 0 10px; }
    .stat { background:#fffbeb; border:1px solid #f59e0b33; color:#92400e; padding:10px 12px; border-radius:8px; }

    .bar { display:flex; gap:8px; align-items:center; margin-top:12px; }
    input[type="text"]{ flex:1; padding:10px 12px; border:1px solid var(--border); border-radius:8px; outline:none; }
    select,button { height:36px; border-radius:8px; border:1px solid var(--border); background:#fff; cursor:pointer; }
    button.primary{ background:var(--brand); color:#fff; border-color:var(--brand); padding:0 14px; }
    button:disabled{ opacity:.6; cursor:not-allowed; }

    main { padding: 16px 20px 60px; }
    .grid { margin-top: 14px; border:1px dashed #d1d5db; min-height:360px; border-radius:10px; background: repeating-linear-gradient(45deg, #f9fafb, #f9fafb 10px, #f3f4f6 10px, #f3f4f6 20px); padding:12px; overflow:auto; }
    table { border-collapse: collapse; width: 100%; background:#fff; border-radius:10px; overflow:hidden; }
    th, td { border-bottom:1px solid #eef2f7; padding:10px 10px; text-align:left; }
    th { position: sticky; top: 0; background: #f8fafc; z-index: 1; }
    td .thumb { width: 54px; height:54px; border:1px solid #e5e7eb; border-radius:8px; object-fit:contain; background:#fff; }
    .toolbar { display: flex; justify-content: space-between; align-items:center; margin:10px 0 0; }
    .muted{ color:var(--muted); }
    footer { padding: 12px 20px 22px; color:#6b7280; }
  </style>

  <!-- favicon: 用 data URL，避免 404 红字 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%232563eb'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-size='28' fill='white' font-family='Arial'%3EM%3C/text%3E%3C/svg%3E"/>

  <!-- ExcelJS & FileSaver（浏览器版） -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

  <!-- 你的页面逻辑 -->
  <script defer src="./ui-enhance.js"></script>
</head>
<body>
  <header>
    <h1>MVP3 — App</h1>
    <div class="tips">这是页面骨架的占位提示（无脚本、无接口），用于验证部署是否稳定。</div>
    <div class="stat" id="stat">抓取成功：共 0 条（预览前 50 条）</div>

    <div class="bar">
      <input id="input-url" type="text" placeholder="粘贴目录页链接…" value="https://www.s-impuls-shop.de/catalog/home-cinema/audio-kabel" />
      <button id="btn-fetch" class="primary">抓取目录</button>
      <select id="sel-limit">
        <option value="50" selected>预设（前 50 条）</option>
        <option value="25">25</option>
        <option value="100">100</option>
      </select>
      <button id="btn-xlsx">导出 Excel（.xlsx）</button>
      <button id="btn-clear">清空数据</button>
    </div>
  </header>

  <main>
    <div class="grid">
      <table id="tbl" style="display:none;">
        <thead>
          <tr>
            <th style="width:60px;">#</th>
            <th style="width:80px;">Picture</th>
            <th style="min-width: 360px;">Description</th>
            <th style="width:90px;">MOQ</th>
            <th style="width:110px;">Unit Price</th>
            <th style="width:80px;">Link</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="empty" class="muted">ui.no_data</div>
    </div>

    <div class="toolbar">
      <span class="muted">© MVP3 — 页面骨架（占位版）。确认部署稳定后，将逐步接回业务逻辑。</span>
    </div>
  </main>

  <footer>
    <a class="muted" href="#" target="_blank" rel="nofollow">支持的网站</a> ·
    <a class="muted" href="#" target="_blank" rel="nofollow">隐私政策</a> ·
    <a class="muted" href="#" target="_blank" rel="nofollow">联系我们</a>
  </footer>
</body>
</html>
